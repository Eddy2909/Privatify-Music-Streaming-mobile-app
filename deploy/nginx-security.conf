# Privatefy – Zugriffsschutz für sensible Pfade (nginx)
#
# WICHTIG: Läuft die Website auf nginx (oder nginx vor Apache), werden
# .htaccess-Dateien ignoriert. Die mitgelieferten .htaccess-Dateien schützen
# dann NICHT. Diese Regeln sind das nginx-Äquivalent.
#
# Einhängen z. B.:
#   - Plesk:  Websites & Domains > <Domain> > Apache & nginx Settings >
#             "Additional nginx directives" -> diesen Block einfügen.
#   - Andere Panels/Server: als server-/vhost-weites include einbinden
#             (include /pfad/nginx-security.conf;).
#
# Nach dem Einfügen prüfen:
#   curl -o /dev/null -w '%{http_code}\n' https://<domain>/schema.sql      # -> 403
#   curl -o /dev/null -w '%{http_code}\n' https://<domain>/.user.ini       # -> 403
#   curl -o /dev/null -w '%{http_code}\n' https://<domain>/app/bootstrap.php # -> 403

# 1) Versteckte Dateien/Ordner sperren (.user.ini, .htaccess, .git, ...).
#    Der HTTP-Zugriff wird gesperrt; PHP liest .user.ini weiterhin von der Platte.
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# 2) Sensible Dateitypen sperren.
location ~* \.(sql|md|log|ini|bak|old|orig|conf)$ {
    deny all;
}

# 3) Interne Anwendungsordner und Datenverzeichnis sperren.
#    Der Player liefert Audio ausschließlich über stream.php (PHP-Dateisystem) aus.
location ~ ^/(app|config|storage)/ {
    deny all;
}

# 4) Installationsroutine nach dem Setup sperren.
#    Die Tabelle playback_state legt api/sync.php bei Bedarf selbst an.
location = /install.php {
    deny all;
}
